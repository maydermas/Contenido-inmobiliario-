    - { escena: identificacion, tipo: "texto→vídeo", prompt: "Inside an empty small shop with light wood floor, a counter and wall shelves, pendant lamps switching on one by one, camera slowly moving in from the entrance, warm cinematic lighting, 9:16, no people" }

publicacion:
  portada: "Antes de alquilar un local, haz esta cuenta"
  descripcion: |
    El alquiler es solo una parte. Suma luz, agua, seguros, personal y gestoría. Y antes de abrir: la fianza (en un local, dos mensualidades por ley, art. 36 LAU), la obra, el mobiliario y las licencias.
    La cuenta clave es tu punto de equilibrio: cuánto tienes que vender cada mes solo para cubrir gastos.
    Ejemplo hipotético: 3.000 € de gastos fijos y un margen del 50 % → necesitas facturar 6.000 € al mes antes de ganar un euro.
    Si esa cifra no es realista, el local no es una oportunidad: es un riesgo.
    ¿Estás valorando un local? Escríbeme LOCAL y lo estudiamos juntos.
  cta: "Escríbeme LOCAL y lo estudiamos juntos."
  hashtags: ["#emprender", "#localcomercial", "#negocio", "#puntodeequilibrio", "#emprendedores", "#Almería", "#RoquetasDeMar", "#Aguadulce"]
  tiktok: "Texto en portada: «¿Cuánto tienes que vender para no perder dinero?». Respuesta automática o manual a quien comente LOCAL."
  instagram: "Reel + respuesta por mensaje directo a la palabra LOCAL (preparar respuesta tipo honesta: qué datos necesitamos para estudiarlo). Ubicación: Roquetas de Mar."
  youtube: "Título: «Antes de alquilar un local, calcula tu punto de equilibrio». #Shorts. Fórmula en la descripción."

fuentes:
  - "Ley 29/1994, de Arrendamientos Urbanos, art. 36.1: fianza de dos mensualidades de renta en arrendamientos para uso distinto del de vivienda (BOE, consultado 20/11/2026). Pueden pactarse garantías adicionales."
  - "Punto de equilibrio = gastos fijos ÷ margen de contribución (definición contable estándar)."

qc: "Ver salida de herramientas/qc.sh en el render final."

