  identificacion: { imagen: "Interior del local: mostrador, taburetes, estanterías, planta, lámparas colgantes que se encienden al decir «abriendo».", camara: "Entrada desde la calle a través del escaparate (dolly in).", sonido: "Pop suave al encender", objetivo: "Ilusión del emprendedor." }
  gastos-fijos: { imagen: "Maqueta en corte del local vista desde arriba; fichas «Alquiler», «+ Luz», «+ Agua», «+ Seguros», «+ Personal», «+ Gestoría».", camara: "Órbita cenital lenta.", sonido: "Tick por ficha", objetivo: "El alquiler es solo una parte." }
  inversion-inicial: { imagen: "Checklist «Antes de abrir» sobre la mesa: fianza legal (2 mensualidades), obra, mobiliario, licencias; nota del art. 36 LAU.", camara: "Acercamiento con giro leve.", sonido: "Papel + ticks", objetivo: "Inversión antes de facturar un euro." }
  pregunta: { imagen: "Pregunta en grande y respuesta «Punto de equilibrio» en tarjeta clara.", camara: "Fija.", sonido: "Pop", objetivo: "Nombrar el concepto clave." }
  ejemplo: { imagen: "Calculadora: gastos fijos 3.000 €, margen 50 %, resultado 6.000 € que cuenta hacia arriba.", camara: "Acercamiento lento.", sonido: "Ticks + pop en el resultado", objetivo: "Cuenta clara (ejemplo hipotético)." }
  conclusion: { imagen: "Tarjeta «Oportunidad» que gira y se convierte en «Riesgo»; el fondo se oscurece.", camara: "Fija; giro 3D de la tarjeta.", sonido: "Whoosh", objetivo: "Giro final memorable." }
  cta: { imagen: "Palabra clave LOCAL en tarjeta beige + «y lo estudiamos juntos»; firma de marca.", camara: "Fija.", sonido: "Pop suave", objetivo: "Conversación cualificada." }

