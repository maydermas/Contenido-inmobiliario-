publicacion:
  portada: "Tener un sueldo no significa poder permitirte una hipoteca"
  descripcion: |
    Pagar un alquiler no significa que puedas asumir una cuota. El banco no mira solo lo que ganas: mira lo que te queda.
    Como referencia orientativa, las entidades suelen considerar que el total de tus deudas no supere el 30–35 % de tus ingresos netos. No es un límite legal y cada entidad aplica sus criterios.
    Ejemplo hipotético: 2.000 € netos → 700 € (35 %) → si ya pagas 300 € de un coche, quedan 400 €.
    Y la entrada y los gastos de compra suelen salir de tus ahorros.
    Información general. Para tu caso concreto, consulta con un profesional habilitado.
  cta: "Compártelo con alguien que esté pensando en comprar."
  hashtags: ["#hipoteca", "#comprarcasa", "#finanzaspersonales", "#educaciónfinanciera", "#ahorro", "#primeravivienda", "#Almería", "#vivienda"]
  tiktok: "Texto en portada: «¿Tu sueldo te da para una hipoteca?». Pregunta en descripción: «¿Lo habías calculado así?». 4–5 hashtags."
  instagram: "Reel + carrusel opcional con la cuenta paso a paso (mismos colores). Comentario fijado con el matiz «no es un límite legal»."
  youtube: "Título: «¿Tu sueldo te da para una hipoteca? La cuenta que hace el banco». #Shorts. Fuente en descripción."

fuentes:
  - "Banco de España, materiales de educación financiera sobre acceso a la hipoteca («las entidades suelen estimar que la carga de deudas no debería superar el 30–35 % de los ingresos»), bde.es, consultado 20/11/2026. Criterio habitual, no norma."

qc: "Ver salida de herramientas/qc.sh en el render final."

