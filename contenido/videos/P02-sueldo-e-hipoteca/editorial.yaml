elegido: 0
motivo: "Frase-título pedida en la directiva, contradice una creencia común y es 100 % sostenible. El gancho del coche se descartó: sugiere una causa única de denegación que no podemos afirmar."

storyboard:
  gancho: { imagen: "Titular tipográfico en 4 líneas con «sueldo» y «permitirte» en serif bronce; línea bronce que se dibuja.", camara: "Escala lenta 1 → 1,06.", sonido: "Música serena", objetivo: "Contradicción clara." }
  identificacion: { imagen: "Dos tarjetas «Alquiler = Cuota» (cada mes); el «=» se tacha y aparece «No es lo mismo».", camara: "Fija, tarjetas entran desde abajo.", sonido: "Tick al tachar", objetivo: "Reflejar el pensamiento del espectador." }
  problema: { imagen: "«Lo que ganas» se tacha y aparece grande «Lo que te queda».", camara: "Fija.", sonido: "Whoosh suave", objetivo: "Cambio de perspectiva." }
  referencia: { imagen: "Anillo que se llena hasta 30 % y se amplía a 35 %; nota de fuente.", camara: "Escala 0,96 → 1,03.", sonido: "Pop", objetivo: "Dar el criterio con su matiz (no es ley)." }
  ejemplo: { imagen: "Cascada de barras con importes: 2.000 € → 700 € → −300 € → 400 € destacado.", camara: "Fija; las barras crecen con la voz.", sonido: "Tick + pop en el resultado", objetivo: "Hacer la cuenta visible (ejemplo hipotético)." }
  ahorros: { imagen: "Depósito «Ahorros» que baja al restar «Entrada» y «Gastos de compra».", camara: "Fija.", sonido: "Tick", objetivo: "Recordar el ahorro previo." }
  conclusion: { imagen: "Llave dorada flotando con halo cálido; frase en serif.", camara: "Dolly in lento.", sonido: "Música abriéndose", objetivo: "Idea memorable: pagar ≠ permitirse." }
  cta: { imagen: "Icono de compartir + texto; firma de marca.", camara: "Fija.", sonido: "Pop suave", objetivo: "Compartir con alguien que esté pensando en comprar." }

