concepto:
  tema: "Tener ingresos no equivale a poder asumir una hipoteca: lo que cuenta es lo que te queda"
  publico: "Personas con sueldo estable (25–40 años) que pagan alquiler y piensan en comprar"
  problema: "Comparan alquiler con cuota y olvidan las deudas existentes, la entrada y los gastos de compra"
  emocion: "Reflexión"
  objetivo: "Que la persona entienda el criterio de endeudamiento y comparta el vídeo con quien esté pensando en comprar"

ganchos:
  - { texto: "Tener un sueldo no significa que puedas permitirte una hipoteca.", familia: D, atencion: 5, identificacion: 5, claridad: 5, curiosidad: 4, intensidad: 4, credibilidad: 5, relacion: 5 }
  - { texto: "Si pagas un alquiler, ¿puedes pagar una hipoteca? No siempre.", familia: H, atencion: 4, identificacion: 5, claridad: 4, curiosidad: 4, intensidad: 3, credibilidad: 5, relacion: 5 }
  - { texto: "El banco no mira lo que ganas. Mira lo que te queda.", familia: C, atencion: 5, identificacion: 4, claridad: 4, curiosidad: 5, intensidad: 3, credibilidad: 4, relacion: 5 }
  - { texto: "Hay una diferencia entre poder pagar algo y poder permitírtelo.", familia: C, atencion: 4, identificacion: 4, claridad: 4, curiosidad: 4, intensidad: 3, credibilidad: 5, relacion: 4 }
  - { texto: "¿Comprarías una casa si supieras que vas a vivir justo todos los meses?", familia: H, atencion: 4, identificacion: 5, claridad: 4, curiosidad: 3, intensidad: 4, credibilidad: 5, relacion: 4 }
  - { texto: "Antes de pedir una hipoteca, haz esta cuenta con tu nómina.", familia: E, atencion: 4, identificacion: 4, claridad: 5, curiosidad: 4, intensidad: 3, credibilidad: 5, relacion: 5 }
  - { texto: "Si trabajas todos los meses y aun así no consigues ahorrar, esto te interesa.", familia: B, atencion: 4, identificacion: 5, claridad: 4, curiosidad: 3, intensidad: 3, credibilidad: 5, relacion: 3 }
  - { texto: "Tener una hipoteca aprobada no significa que debas aceptarla.", familia: D, atencion: 4, identificacion: 3, claridad: 4, curiosidad: 4, intensidad: 3, credibilidad: 5, relacion: 3 }
