publicacion:
  portada: "Antes de entregar una señal, mira esto"
  descripcion: |
    Te gusta la casa y te piden una señal para reservarla. Antes de pagar, tres comprobaciones:
    1️⃣ Pide la nota simple del Registro de la Propiedad: verás quién es el titular y si hay hipotecas o embargos inscritos.
    2️⃣ Lee qué tipo de arras firmas. Con arras penitenciales (art. 1454 del Código Civil), si te echas atrás pierdes la señal y, si se echa atrás el vendedor, te la devuelve duplicada. Tienen que pactarse de forma expresa.
    3️⃣ Pregunta qué pasa con la señal si el banco no te concede la hipoteca. Si no está escrito, no está pactado.
    Información general: revisa tu contrato con un profesional antes de firmar.
  cta: "Guarda este vídeo antes de tu próxima visita. ¿Dudas con una reserva? Escríbeme y lo estudiamos juntos."
  hashtags: ["#arras", "#señal", "#comprarvivienda", "#notasimple", "#primeravivienda", "#consejosinmobiliarios", "#Almería", "#RoquetasDeMar", "#vivienda"]
  tiktok: "Texto en portada: «¿Vas a dejar una señal?». Pregunta para comentarios: «¿Te explicaron qué tipo de arras firmabas?»."
  instagram: "Reel con el pie completo (3 pasos numerados). Comentario fijado: «Guárdalo para tu próxima visita»."
  youtube: "Título: «Antes de dejar una señal por una casa, revisa esto (arras)». #Shorts."

fuentes:
  - "Código Civil, art. 1454 (arras penitenciales: quien desiste pierde las arras; el vendedor las devuelve duplicadas). Jurisprudencia del Tribunal Supremo: deben pactarse de forma expresa (consultado 21/11/2026)."
  - "Colegio de Registradores: la nota simple es un extracto informativo con titularidad y cargas inscritas (hipotecas, embargos), solicitable en el Registro o en registradores.org (consultado 21/11/2026)."

