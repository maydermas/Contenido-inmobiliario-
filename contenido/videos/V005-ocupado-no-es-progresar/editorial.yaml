motivo: "Frase del banco de temas, directa y con contradicción clara; el vídeo la convierte en algo accionable (una sola cosa cada domingo) para no quedarse en frase motivacional."

storyboard:
  gancho: { imagen: "Titular en cuatro líneas: «ocupado» y «progresando» en serif bronce.", camara: "Escala lenta.", sonido: "Música cálida", objetivo: "Contradicción que detiene el scroll." }
  identificacion: { imagen: "Ticket «Tu semana»: llamadas, mensajes, recados marcados.", camara: "Subida suave.", sonido: "Ticks", objetivo: "Identificación con una semana real." }
  problema: { imagen: "Tarjetas «Moverse» y «Avanzar»; el = se tacha: «Moverse no es avanzar».", camara: "Fija.", sonido: "Tick", objetivo: "Definir la diferencia." }
  accion: { imagen: "Hoja «Esta semana» con casillas: una sola cosa, ahorrar, formarte, ordenar tus cuentas.", camara: "Acercamiento.", sonido: "Papel + ticks", objetivo: "Acción concreta." }
  prioridad: { imagen: "«Primero lo urgente» se tacha; aparece «Primero lo importante».", camara: "Fija.", sonido: "Whoosh", objetivo: "Regla práctica." }
  conclusion: { imagen: "Ventana con luz cálida; frase en serif.", camara: "Dolly in lento.", sonido: "Música abriéndose", objetivo: "Alivio y cierre." }
  cta: { imagen: "Icono de mensaje + «Cuéntamela en comentarios» + firma Capital 4 Tune.", camara: "Fija.", sonido: "Pop suave", objetivo: "Comentarios." }

prompts:
  nota: "Pieza tipográfica y 2.5D hecha por código; no requiere modelos generativos."
  lista: []

publicacion:
  portada: "Ocupado no es lo mismo que progresar"
  descripcion: |
    Hay semanas en las que no paras y aun así sientes que no has avanzado.
    Estar ocupado es moverse. Progresar es acercarte a algo que tú has decidido.
    Prueba esto: cada domingo, escribe una sola cosa que te acerque a tu objetivo (ahorrar, formarte, ordenar tus cuentas) y hazla antes que todo lo demás. Lo urgente siempre encuentra hueco. Lo importante, no.
    Avanzar despacio, pero en la dirección correcta, también es avanzar.
  cta: "¿Cuál sería tu una sola cosa esta semana? Te leo en comentarios 👇"
  hashtags: ["#productividad", "#crecimientopersonal", "#habitos", "#finanzaspersonales", "#ahorro", "#mentalidad", "#Almería"]
  tiktok: "Texto en portada: «¿Ocupado o avanzando?». Responder a los comentarios con la «una sola cosa» de cada persona."
  instagram: "Comentario fijado con un ejemplo propio: «La mía esta semana: revisar mis suscripciones»."
  youtube: "Título: «Estar ocupado no es progresar (el hábito del domingo)». #Shorts."

