  - { texto: "¿Cuándo fue la última semana en la que avanzaste de verdad?", familia: H, atencion: 4, identificacion: 4, claridad: 4, curiosidad: 4, intensidad: 4, credibilidad: 5, relacion: 4 }
  - { texto: "Hacer muchas cosas no es lo mismo que hacer las importantes.", familia: C, atencion: 4, identificacion: 4, claridad: 5, curiosidad: 3, intensidad: 3, credibilidad: 5, relacion: 5 }
  - { texto: "No necesitas más horas. Necesitas una sola cosa.", familia: F, atencion: 4, identificacion: 4, claridad: 4, curiosidad: 5, intensidad: 3, credibilidad: 4, relacion: 5 }
